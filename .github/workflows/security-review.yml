name: security-review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 3'

concurrency:
  group: security-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP passive baseline
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build review image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: arrcontrol:security-review
      - name: Run passive dynamic review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/zap
          chmod 0777 artifacts/zap
          docker network create arrcontrol-security-review
          cleanup() {
            docker rm --force arrcontrol-security-review-app >/dev/null 2>&1 || true
            docker rm --force arrcontrol-security-review-db >/dev/null 2>&1 || true
            docker network rm arrcontrol-security-review >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name arrcontrol-security-review-db \
            --network arrcontrol-security-review \
            --env POSTGRES_DB=arrcontrol \
            --env POSTGRES_USER=arrcontrol \
            --env POSTGRES_PASSWORD=security-review-password \
            postgres:17-alpine
          for attempt in {1..30}; do
            if docker exec arrcontrol-security-review-db pg_isready -U arrcontrol -d arrcontrol >/dev/null; then
              break
            fi
            test "${attempt}" -lt 30
            sleep 1
          done
          docker run --detach --name arrcontrol-security-review-app \
            --network arrcontrol-security-review \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env ASPNETCORE_URLS=http://+:8080 \
            --env ConnectionStrings__Database='Host=arrcontrol-security-review-db;Database=arrcontrol;Username=arrcontrol;Password=security-review-password' \
            arrcontrol:security-review
          for attempt in {1..30}; do
            if docker run --rm --network arrcontrol-security-review \
              curlimages/curl@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40 \
              --fail --silent http://arrcontrol-security-review-app:8080/health/live >/dev/null; then
              break
            fi
            test "${attempt}" -lt 30
            sleep 1
          done
          docker run --rm --network arrcontrol-security-review \
            --volume "${PWD}/artifacts/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
            zap-baseline.py -t http://arrcontrol-security-review-app:8080 \
            -m 1 -I -r zap.html -J zap.json
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-security-review
          path: artifacts/zap/
          if-no-files-found: error
          retention-days: 30
